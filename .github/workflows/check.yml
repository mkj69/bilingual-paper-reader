name: Check reader
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_reader.py examples/demo.json /tmp/demo.html
      - run: diff examples/demo.html /tmp/demo.html
